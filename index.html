{id:1,n:"Thì hiện tại đơn",t:`<h3>Present Simple</h3><ul><li><b>Khẳng định:</b> S + V(s/es). <b>Phủ định:</b> S + do/does not + V. <b>Nghi vấn:</b> Do/Does + S + V?</li><li><b>Cách dùng:</b> thói quen, sự thật hiển nhiên, lịch trình cố định.</li><li><b>Dấu hiệu:</b> always, usually, often, sometimes, never, every day.</li><li><b>Thêm -s/-es:</b> động từ tận cùng -s, -x, -ch, -sh, -o thêm <i>es</i>; phụ âm + y đổi thành <i>ies</i> (study → studies).</li></ul><p>Ví dụ: <em>She goes to school every day.</em> (thói quen) <em>Water boils at 100°C.</em> (sự thật) <em>The train leaves at 8 p.m.</em> (lịch trình) <em>He doesn’t like coffee.</em></p>`,
x:{nb:{m:[["She ___ to school every day.",["goes","go","going","is go"],0],["Water ___ at 100°C.",["boil","boils","is boiling","boiled"],1],["They ___ TV in the evening.",["watches","watch","is watching","watched"],1],["He ___ like coffee.",["don’t","doesn’t","isn’t","not"],1]],e:[["Chia động từ: He (go) ___ to work by bus.","goes"]]},

{id:2,n:"Mạo từ (a, an, the)",t:`<h3>Articles</h3><ul><li><b>a:</b> trước âm phụ âm (a book, a university /ju:/).</li><li><b>an:</b> trước âm nguyên âm (an apple, an hour vì /h/ câm).</li><li><b>the:</b> danh từ đã xác định, duy nhất, so sánh nhất, nhạc cụ, đại dương.</li><li><b>Không dùng mạo từ:</b> danh từ số nhiều nói chung, môn học, bữa ăn, thể thao.</li></ul><p>Ví dụ: <em>She has an apple.</em> <em>The sun rises in the east.</em> <em>I have breakfast at 6.</em> <em>He plays football and the guitar.</em></p>`,

{id:3,n:"So sánh hơn và so sánh nhất",t:`<h3>Comparison</h3><ul><li><b>Tính từ ngắn:</b> adj-er + than / the adj-est (tall → taller → the tallest). Gấp đôi phụ âm: big → bigger; đổi y → ier: happy → happier.</li><li><b>Tính từ dài:</b> more + adj + than / the most + adj.</li><li><b>Bất quy tắc:</b> good → better → best; bad → worse → worst; far → farther → farthest.</li><li><b>So sánh bằng:</b> as + adj + as. <b>So sánh kép:</b> the + so sánh hơn, the + so sánh hơn.</li></ul><p>Ví dụ: <em>Tom is taller than Jack.</em> <em>This book is more interesting than that one.</em> <em>She is the smartest girl in class.</em> <em>The more you practise, the better you become.</em></p>`,

th:{m:[["So sánh hơn của “happy” là:",["happier","more happy","happyer","happiest"],0],["He is as ___ as his brother.",["tall","taller","tallest","more tall"],0],["So sánh nhất của “bad” là:",["baddest","worst","worse","most bad"],1],["This shop is ___ than that one.",["more cheaper","cheaper","more cheap","cheapest"],1]],e:[["Hoàn thành: Today is (hot) ___ than yesterday.","hotter"]]},
vd:{m:[["The more you practise, ___ you become.",["the better","better","the best","more better"],0],["Mount Everest is ___ mountain in the world.",["the higher","higher","the highest","highest"],2],["My house is not ___ yours.",["as big as","bigger than","so bigger","the biggest"],0],["She speaks English ___ than she did last year.",["fluently","more fluently","most fluently","fluenter"],1]],e:[["Viết lại: Anna is 1.6 m tall. Mary is 1.7 m tall. Mary is ___ Anna.","taller than"]]}}}];
const sh=a=>a.sort(()=>Math.random()-.5);

D.push({id:4,n:"Thì quá khứ đơn",t:`<h3>Past Simple</h3><ul><li><b>Khẳng định:</b> S + V2/V-ed. <b>Phủ định:</b> S + did not + V. <b>Nghi vấn:</b> Did + S + V? (với <i>be</i>: was/were).</li><li><b>Cách dùng:</b> hành động đã xảy ra và kết thúc hẳn trong quá khứ.</li><li><b>Dấu hiệu:</b> yesterday, last week, two days ago, in 2019, when I was a child.</li><li><b>Quy tắc -ed:</b> stop → stopped, study → studied. <b>Bất quy tắc:</b> go → went, see → saw, buy → bought, have → had.</li></ul><p>Ví dụ: <em>I went to Hue last summer.</em> <em>She didn’t come to the party.</em> <em>Did you enjoy the trip?</em></p>`,x:{nb:{m:[],e:[["Chia động từ: I (visit) ___ my aunt last Sunday.","visited"]]},th:{m:[],e:[["Viết câu phủ định: He cleaned the room.","He didn’t clean the room."]]},vd:{m:[],e:[["Sửa lỗi cả câu: Yesterday I go to the market and buyed some fish.","Yesterday I went to the market and bought some fish."]]}}});

D.push({id:17,n:"Thì hiện tại hoàn thành",t:`<h3>Present Perfect</h3><ul><li><b>Công thức:</b> S + have/has + V3/V-ed. Phủ định: have/has not + V3. Nghi vấn: Have/Has + S + V3?</li><li><b>Cách dùng:</b> hành động xảy ra chưa rõ thời điểm; kết quả còn ở hiện tại; kinh nghiệm; hành động bắt đầu từ quá khứ kéo dài đến nay.</li><li><b>Dấu hiệu:</b> already, yet, just, ever, never, so far, recently, since + mốc, for + khoảng thời gian.</li><li><b>Phân biệt:</b> has gone (đã đi, chưa về) và has been (đã đến rồi về). Không dùng với yesterday, last week, in 2019.</li></ul><p>Ví dụ: <em>I have seen this film three times.</em> <em>She has lived here since 2010.</em> <em>Have you ever been to Paris?</em></p>`,x:{nb:{m:[],e:[["Chia động từ: She (live) ___ here for five years.","has lived"]]},th:{m:[],e:[["Viết câu phủ định: I have seen that film.","I haven’t seen that film."]]},vd:{m:[],e:[["Sửa lỗi cả câu: I have visited Hue last year and I never eat bun bo.","I visited Hue last year and I have never eaten bun bo."]]}}});
D.push({id:30,n:"Câu điều kiện",t:`<h3>Conditional Sentences</h3><ul><li><b>Loại 0:</b> If + hiện tại đơn, hiện tại đơn (sự thật, quy luật).</li><li><b>Loại 1:</b> If + hiện tại đơn, will + V (có thể xảy ra ở tương lai).</li><li><b>Loại 2:</b> If + quá khứ đơn, would + V (không có thật ở hiện tại; dùng <i>were</i> cho mọi ngôi).</li><li><b>Loại 3:</b> If + quá khứ hoàn thành, would have + V3 (không có thật ở quá khứ).</li><li><b>Hỗn hợp:</b> If + quá khứ hoàn thành, would + V (quá khứ ảnh hưởng hiện tại). <b>Unless</b> = if … not.</li></ul><p>Ví dụ: <em>If you heat ice, it melts.</em> <em>If it rains, we will stay at home.</em> <em>If I were you, I would apologise.</em> <em>If she had studied, she would have passed.</em></p>`,x:{nb:{m:[],e:[["Chia động từ: If it rains, we (stay) ___ at home.","will stay"]]},th:{m:[],e:[["Điền từ: Unless you ___, you will be late. (hurry)","hurry"]]},vd:{m:[],e:[["Hoàn thành: If I had known her number, I ___ her. (call)","would have called"]]}}});

f(31,`<h3>Passive Voice</h3><ul><li><b>Công thức:</b> S + be + V3/V-ed (+ by O). Tân ngữ của câu chủ động trở thành chủ ngữ của câu bị động.</li><li><b>Theo thì:</b> HTĐ am/is/are + V3; QKĐ was/were + V3; HTHT have/has been + V3; TLĐ will be + V3; HTTD am/is/are being + V3; modal + be + V3.</li><li><b>Chỉ chuyển được động từ có tân ngữ</b> (arrive, happen… không có bị động). Bỏ “by + tác nhân” khi không rõ hoặc không quan trọng.</li><li><b>Đặc biệt:</b> have/get + O + V3 (nhờ làm giúp); bị động kép: People say that he is rich → He is said to be rich; bị động của make/see/hear: He was made to clean the room.</li></ul><p>Ví dụ: <em>The cake was made by my mother.</em> <em>English is spoken all over the world.</em> <em>I had my car repaired.</em> <em>The work must be finished today.</em></p>`,[[["Chia động từ: The cake (make) ___ by my mother.","was made"],["Chia động từ: English (speak) ___ all over the world.","is spoken"]],[["Viết lại bị động: They built this bridge in 1990.","This bridge was built in 1990."],["Viết lại bị động: Someone has cleaned the room.","The room has been cleaned."]],[["Viết lại: People say that he is a good doctor. (He …)","He is said to be a good doctor."],["Hoàn thành: I had my bike ___ yesterday. (repair)","repaired"]]]);
f(32,`<h3>Reported Speech</h3><ul><li><b>Lùi thì:</b> HTĐ → QKĐ; HTTD → QKTD; HTHT → QKHT; QKĐ → QKHT; will → would; can → could; must → had to.</li><li><b>Đổi ngôi và trạng từ:</b> now → then; today → that day; tomorrow → the next day; yesterday → the day before; here → there; this → that; ago → before.</li><li><b>Câu hỏi Yes/No:</b> asked + if/whether + S + V (lùi thì). <b>Câu hỏi Wh:</b> asked + từ hỏi + S + V (không đảo).</li><li><b>Mệnh lệnh:</b> told/asked + O + (not) to V. <b>Động từ tường thuật khác:</b> suggest + V-ing, apologise for + V-ing, advise/warn + O + to V.</li></ul><p>Ví dụ: <em>She said, “I am tired.” → She said she was tired.</em> <em>“Do you like tea?” → He asked me if I liked tea.</em> <em>“Don’t be late.” → She told us not to be late.</em></p>`,[[["Hoàn thành: He said, “I am happy.” → He said that he ___ happy.","was"],["Điền từ: “I will come tomorrow.” → She said she ___ come the next day.","would"]],[["Viết lại: “Do you like music?” she asked me. → She asked me if ___","I liked music"],["Viết lại: “Close the window,” he told me. → He told me ___","to close the window"]],[["Viết lại: “Where did you go yesterday?” he asked me. → He asked me where ___","I had gone the day before"],["Hoàn thành: “Let’s have a picnic,” she said. → She suggested ___ a picnic. (have)","having"]]]);

f(5,`<h3>Nouns</h3><ul><li><b>Đếm được / không đếm được:</b> book, chair (đếm được); water, information, advice, furniture, news, homework (không đếm được, không có số nhiều, dùng a piece of / some).</li><li><b>Số nhiều:</b> + s; -s/-x/-ch/-sh/-o + es (box → boxes); phụ âm + y → ies (city → cities); -f/-fe → ves (knife → knives). Bất quy tắc: man → men, child → children, tooth → teeth, mouse → mice, person → people. Không đổi: sheep, fish, deer.</li><li><b>Sở hữu cách:</b> người/vật sống + ’s (Tom’s book); số nhiều tận cùng s + ’ (the students’ room); vật + of (the door of the room).</li><li><b>Lượng từ:</b> many/few/a few + đếm được số nhiều; much/little/a little + không đếm được. few/little mang nghĩa phủ định (hầu như không).</li></ul><p>Ví dụ: <em>There are three children in the room.</em> <em>The news is good.</em> <em>How much water do you drink?</em> <em>The students’ room is big.</em></p>`,[[["Viết số nhiều của “child”.","children"],["Viết số nhiều của “city”.","cities"]],[["Điền much hoặc many: How ___ students are there?","many"],["Viết dạng sở hữu: the book of Tom → ___ book","Tom’s"]],[["Sửa lỗi cả câu: She gave me some advices about the informations.","She gave me some advice about the information."],["Điền a little hoặc little: I have ___ time, so I can’t go with you.","little"]]]);

f(8,`<h3>Auxiliary Verbs</h3><ul><li><b>do/does/did + V (nguyên mẫu):</b> tạo phủ định (doesn’t like), nghi vấn (Did he come?), nhấn mạnh (I do like it), tránh lặp (She likes tea, and so do I).</li><li><b>be + V-ing / V3:</b> thuộc thì tiếp diễn (is reading) và bị động (was made).</li><li><b>have/has/had + V3:</b> thuộc các thì hoàn thành (has gone, had left).</li><li><b>Lưu ý:</b> sau does/did luôn dùng động từ nguyên mẫu; trợ động từ quyết định câu trả lời ngắn (Do you like tea? – Yes, I do.); đảo trợ động từ sau Not only, Hardly, Never…</li></ul><p>Ví dụ: <em>She doesn’t like fish.</em> <em>Did he finish his homework?</em> <em>He has gone home.</em> <em>Not only does he sing well, but he also dances well.</em></p>`,[[["Điền trợ động từ: ___ she like music?","Does"],["Điền trợ động từ: They ___ not go to school yesterday.","did"]],[["Viết câu phủ định: He has finished his work.","He hasn’t finished his work."],["Chuyển sang nghi vấn: She did her homework.","Did she do her homework?"]],[["Sửa lỗi cả câu: Does she can swim? She don’t know how.","Can she swim? She doesn’t know how."],["Điền: Not only ___ he sing well, but he also dances well.","does"]]]);
f(9,`<h3>Modal Verbs</h3><ul><li><b>Quy tắc:</b> modal + V nguyên mẫu (không to, không thêm s). Phủ định + not; nghi vấn đảo lên trước chủ ngữ (Can she swim?).</li><li><b>can/could:</b> khả năng, xin phép, nhờ vả lịch sự (Could you…?). <b>may/might:</b> khả năng, xin phép trang trọng (May I…?).</li><li><b>must:</b> bắt buộc, suy đoán chắc chắn; <b>mustn’t:</b> cấm; <b>don’t have to / needn’t:</b> không cần thiết; <b>can’t:</b> chắc chắn không.</li><li><b>should/ought to/had better:</b> lời khuyên. <b>Would:</b> lời mời, giả định (Would you like…?).</li><li><b>Modal + have + V3:</b> must have V3 (chắc là đã), can’t have V3 (chắc chắn không phải), should have V3 (đáng lẽ nên), may/might have V3 (có thể đã).</li></ul><p>Ví dụ: <em>She can speak three languages.</em> <em>You mustn’t park here.</em> <em>You don’t have to come.</em> <em>He must have gone out.</em> <em>You should have told me.</em></p>`,[[["Điền modal verb (cấm đoán): You ___ park here. It’s forbidden.","mustn’t"],["Điền modal verb (khả năng): She ___ swim very well.","can"]],[["Điền (không cần thiết): You ___ wear a uniform; it’s optional.","don’t have to"],["Viết lại với should: It’s a good idea to see a doctor. → You ___ see a doctor.","should"]],[["Hoàn thành (chắc chắn): He isn’t here. He ___ have gone home.","must"],["Sửa lỗi cả câu: She can to swim and she must goes now.","She can swim and she must go now."]]]);
